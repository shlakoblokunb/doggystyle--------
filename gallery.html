<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Галерея | Бультерьер</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="header">

    <div class="logo">
        BullLover
    </div>

    <nav class="nav" id="nav">

        <a href="index.html">Главная</a>
        <a href="about.html">О породе</a>
        <a href="care.html">Уход</a>
        <a href="gallery.html">Галерея</a>
        <a href="facts.html">Факты</a>
        <a href="contacts.html">Контакты</a>

    </nav>

    <button
        class="burger"
        id="burger"
        aria-label="Открыть меню">

        ☰

    </button>

</header>

<section class="page-hero">

    <div class="container">

        <h1>

            Галерея

        </h1>

        <p>

            Взгляните на эти смешные мордочки своими глазами

        </p>

    </div>

</section>

<!-- ФИЛЬТРЫ -->

<section>

    <div class="container">


            <button
                class="filter-btn active"
                data-filter="all">

                Все

            </button>

            <button
                class="filter-btn"
                data-filter="puppy">

                Щенки

            </button>

            <button
                class="filter-btn"
                data-filter="adult">

                Взрослые

            </button>

            <button
                class="filter-btn"
                data-filter="play">

                Играющие

            </button>


    </div>

</section>

<!-- КАРУСЕЛЬ -->

<section>

    <div class="container">

        <div class="gallery-carousel">

            <button
                class="gallery-arrow gallery-prev"
                id="galleryPrev"
                aria-label="Предыдущее фото">

                ❮

            </button>

            <div
                class="gallery-circle"
                id="galleryCircle">

            </div>

            <button
                class="gallery-arrow gallery-next"
                id="galleryNext"
                aria-label="Следующее фото">

                ❯

            </button>

        </div>

    </div>

</section>

<!-- МОДАЛЬНОЕ ОКНО -->

<footer>
    <div class="footer-content">
        <h3>BullLover</h3>
        <p>Информационный сайт о породе бультерьер</p>
        <p>© 2026</p>
    </div>
</footer>

<button
    id="topBtn"
    aria-label="Наверх">

    ↑

</button>

<script type="module" src="js/gallery.js"></script>

</body>

</html>
